[project]
name = "agent-cost-down"
version = "0.1.0"
description = "Executable agent policies with independent outcome evaluation"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["pydantic>=2.11,<3", "httpx>=0.28,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4"]

[project.scripts]
acd = "agent_cost_down.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_cost_down"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
