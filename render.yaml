services:
  - type: web
    name: agent-cost-down-api
    runtime: docker
    plan: free
    # TCP health checks preserve authenticated HTTP access during preparation.
    autoDeployTrigger: off
    envVars:
      - key: ACD_PREPARATION_MODE
        value: "true"
      - key: ACD_PREPARATION_TOKEN
        sync: false
      - key: ACD_LIVE_ENABLED
        value: "false"
      - key: ACD_MODELS
        value: /etc/secrets/models.json
      - key: ACD_POLICIES
        value: /etc/secrets/policies.json
      - key: ACD_SUITE
        value: /app/fixtures-v3
      - key: NEBIUS_API_KEY
        sync: false
      - key: ACD_DATABASE_URL
        sync: false
      - key: ACD_JUDGE_CODE
        sync: false
      - key: ACD_CLIENT_SALT
        sync: false
      - key: ACD_ALLOWED_ORIGINS
        sync: false
